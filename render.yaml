services:
  - type: web
    name: cirvio
    env: node
    rootDir: cirvio-backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: "https://cirvio-panel.netlify.app,https://cirvio.netlify.app,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000"
      - key: AUTO_APPROVE_LISTINGS
        value: "false"
      - key: ADMIN_EMAIL
        value: alishafaq782@gmail.com
      - key: ADMIN_PASSWORD
        value: changeme123
