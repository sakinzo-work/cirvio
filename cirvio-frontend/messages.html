<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - CIRVIO</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="messages-body">
    <main class="chat-page">
        <aside class="chat-sidebar">
            <div class="chat-brand">
                <div>
                    <a href="index.html" class="chat-back" aria-label="CIRVIO home">
                        <img src="cirvio-logo-header.png" alt="CIRVIO">
                    </a>
                    <span>Messages</span>
                </div>
                <nav class="chat-head-actions" aria-label="Message navigation">
                    <a href="index.html" class="chat-action-btn" aria-label="Back to home" title="Back to home">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
                    </a>
                    <a href="profile.html" class="chat-action-btn" aria-label="Settings" title="Settings">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L4.2 7A2 2 0 1 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 .9-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6.9h.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
                    </a>
                </nav>
            </div>
            <div class="chat-search">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="chatSearch" type="search" placeholder="Search chats">
            </div>
            <div class="chat-thread-list" id="chatThreadList"></div>
            <div class="chat-user-strip" id="chatUserStrip"></div>
        </aside>

        <section class="chat-main" id="chatMain">
            <div class="chat-empty" id="chatEmpty">
                <div class="message-icon chat-logo-mark"><img src="cirvio-logo-header.png" alt="CIRVIO"></div>
                <h1>Product group chats</h1>
                <p>Select a chat to talk with the buyer, seller and CIRVIO admin in one safe place.</p>
                <a class="btn btn-terracotta" href="explore.html">Browse Products</a>
            </div>

            <div class="chat-room" id="chatRoom" hidden>
                <header class="chat-room-head">
                    <button class="btn-icon chat-mobile-back" id="chatMobileBack" aria-label="Back to chats">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </button>
                    <img id="chatProductImg" src="cirvio-logo-header.png" alt="" onerror="this.onerror=null;this.src='cirvio-logo-header.png';">
                    <div>
                        <h1 id="chatProductTitle">Product chat</h1>
                        <p id="chatParties">Product chat - Buyer, Seller, CIRVIO Admin</p>
                    </div>
                    <nav class="chat-room-actions" aria-label="Message actions">
                        <a href="index.html" class="chat-action-btn" aria-label="Back to home" title="Back to home">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
                        </a>
                        <a href="profile.html" class="chat-action-btn" aria-label="Settings" title="Settings">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L4.2 7A2 2 0 1 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 .9-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6.9h.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
                        </a>
                        <button class="chat-action-btn chat-delete-btn" id="chatDeleteBtn" type="button" aria-label="Delete chat" title="Delete chat">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5"/><path d="M14 11v5"/></svg>
                        </button>
                    </nav>
                </header>
                <div class="chat-messages" id="chatMessages"></div>
                <form class="chat-composer" id="chatComposer">
                    <button class="chat-tool-btn" type="button" aria-label="Attach file" title="Attach file">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m21.4 11.6-8.5 8.5a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
                    </button>
                    <textarea id="chatInput" placeholder="Type a message..." rows="1"></textarea>
                    <button class="chat-tool-btn chat-emoji-btn" type="button" aria-label="Emoji" title="Emoji">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.3 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/></svg>
                    </button>
                    <button class="chat-send-btn" id="chatSendBtn" type="submit" aria-label="Send message">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 2 11 13"/>
                            <path d="m22 2-7 20-4-9-9-4 20-7z"/>
                        </svg>
                        <span>Send</span>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke-width="2">
            <path d="M20 6L9 17l-5-5" />
        </svg><span id="toastMsg">Message sent</span></div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="common.js"></script>
    <script>
        let activeThreadId = '';
        let activeThreads = [];
        const chatLogo = 'cirvio-logo-header.png';
        const backendIdPattern = /^[a-f\d]{24}$/i;

        const listEl = document.getElementById('chatThreadList');
        const emptyEl = document.getElementById('chatEmpty');
        const roomEl = document.getElementById('chatRoom');
        const messagesEl = document.getElementById('chatMessages');
        const userStripEl = document.getElementById('chatUserStrip');
        const deleteBtn = document.getElementById('chatDeleteBtn');

        function escChat(value) {
            return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        function profilePhoto() {
            return CirvioStore.getProfile().photo || '';
        }

        function validBackendId(value) {
            return backendIdPattern.test(String(value || ''));
        }

        function chatThumb(src, alt = '') {
            const cleanSrc = src || chatLogo;
            return `<img src="${escChat(cleanSrc)}" alt="${escChat(alt)}" onerror="this.onerror=null;this.src='${chatLogo}';this.classList.add('logo-fallback');">`;
        }

        function formatChatTime(value) {
            const date = value ? new Date(value) : null;
            if (!date || Number.isNaN(date.getTime())) return '';
            const now = new Date();
            const sameDay = date.toDateString() === now.toDateString();
            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);
            if (sameDay) return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function renderUserStrip() {
            const profile = CirvioStore.getProfile();
            const name = profile.name || 'You';
            const role = profile.role || 'Buyer';
            const avatar = profile.photo
                ? `<img src="${escChat(profile.photo)}" alt="${escChat(name)}">`
                : `<span>${escChat(name.charAt(0) || 'Y')}</span>`;
            userStripEl.innerHTML = `
                <div class="chat-user-avatar">${avatar}</div>
                <div>
                    <strong>${escChat(name)}</strong>
                    <small>${escChat(role)}</small>
                </div>
                <a href="profile.html" class="chat-user-menu" aria-label="Profile settings" title="Profile settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                </a>
            `;
        }

        function groupThreads() {
            const byThread = new Map();
            CirvioStore.getMessages().forEach((m) => {
                const key = m.threadId || m.backendKey || String(m.id);
                if (!byThread.has(key)) {
                    byThread.set(key, {
                        id: key,
                        productId: m.productId,
                        productTitle: m.productTitle || 'Product chat',
                        productImg: m.productImg || '',
                        messages: []
                    });
                }
                byThread.get(key).messages.push(m);
            });
            return [...byThread.values()].map((thread) => {
                thread.messages.sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
                thread.latest = thread.messages[thread.messages.length - 1];
                thread.unread = thread.messages.some((m) => !isOwnMessage(m) && !m.read);
                return thread;
            }).sort((a, b) => new Date(b.latest?.createdAt || 0) - new Date(a.latest?.createdAt || 0));
        }

        function renderThreadList() {
            const q = document.getElementById('chatSearch').value.trim().toLowerCase();
            activeThreads = groupThreads();
            const filtered = q ? activeThreads.filter((t) => t.productTitle.toLowerCase().includes(q) || (t.latest?.text || '').toLowerCase().includes(q)) : activeThreads;
            listEl.innerHTML = filtered.length ? filtered.map((t) => `
                <button class="chat-thread ${t.id === activeThreadId ? 'active' : ''} ${t.unread ? 'unread' : ''}" data-thread="${escChat(t.id)}">
                    ${chatThumb(t.productImg, t.productTitle)}
                    <span class="chat-thread-copy">
                        <span class="chat-thread-top">
                            <strong>${escChat(t.productTitle)}</strong>
                            <time>${escChat(formatChatTime(t.latest?.createdAt))}</time>
                        </span>
                        <small>${escChat(isOwnMessage(t.latest || {}) ? 'You' : (t.latest?.from === 'cirvio' ? 'CIRVIO Admin' : (t.latest?.from === 'seller' ? 'Seller' : 'Buyer')))}: ${escChat(t.latest?.text || '')}</small>
                    </span>
                </button>
            `).join('') : '<div class="chat-list-empty">No chats yet.</div>';
        }

        function markActiveRead() {
            const messages = CirvioStore.getMessages();
            let changed = false;
            messages.forEach((m) => {
                if (m.threadId === activeThreadId && !isOwnMessage(m) && !m.read) {
                    m.read = true;
                    changed = true;
                }
            });
            if (changed) {
                CirvioStore.setMessages(messages);
                refreshMsgBadge();
            }
        }

        function selectThread(id) {
            activeThreadId = id;
            const thread = groupThreads().find((t) => t.id === id);
            if (!thread) return;
            markActiveRead();
            emptyEl.hidden = true;
            roomEl.hidden = false;
            document.body.classList.add('chat-open');
            document.getElementById('chatProductTitle').textContent = thread.productTitle;
            const shortId = thread.productId ? `Product ID ${String(thread.productId).slice(-6).toUpperCase()} - ` : '';
            document.getElementById('chatParties').textContent = `${shortId}Buyer, Seller, CIRVIO Admin`;
            const productImg = document.getElementById('chatProductImg');
            productImg.onerror = () => {
                productImg.onerror = null;
                productImg.src = chatLogo;
                productImg.classList.add('logo-fallback');
            };
            productImg.classList.toggle('logo-fallback', !thread.productImg);
            productImg.src = thread.productImg || chatLogo;
            renderMessages(thread);
            renderThreadList();
        }

        function removeThreadFromLocal(threadId) {
            const messages = CirvioStore.getMessages().filter((m) => {
                const key = m.threadId || m.backendKey || String(m.id);
                return key !== threadId;
            });
            CirvioStore.setMessages(messages);
            refreshMsgBadge();
            window.dispatchEvent(new CustomEvent('cirvio:messages-synced', { detail: { messages } }));
        }

        async function deleteActiveThread() {
            if (!activeThreadId) return;
            const thread = groupThreads().find((t) => t.id === activeThreadId);
            if (!thread) return;
            if (!window.confirm(`Delete chat for "${thread.productTitle}"?`)) return;
            try {
                deleteBtn.disabled = true;
                if (window.CirvioAPI && validBackendId(thread.id)) {
                    await CirvioAPI.deleteMessage(thread.id);
                }
                removeThreadFromLocal(thread.id);
                activeThreadId = '';
                roomEl.hidden = true;
                emptyEl.hidden = false;
                document.body.classList.remove('chat-open');
                renderThreadList();
                openFirstThreadOnDesktop();
                showToast('Chat deleted');
            } catch (err) {
                showToast(err.message || 'Could not delete chat');
            } finally {
                deleteBtn.disabled = false;
            }
        }

        function addLocalReply(thread, text) {
            const messages = CirvioStore.getMessages();
            const now = new Date().toISOString();
            messages.push({
                id: Date.now(),
                threadId: thread.id,
                productId: thread.productId,
                productTitle: thread.productTitle,
                productImg: thread.productImg,
                text,
                from: 'buyer',
                senderId: currentUserId(),
                senderRole: 'buyer',
                read: true,
                createdAt: now,
                time: 'Just now'
            });
            CirvioStore.setMessages(messages);
            refreshMsgBadge();
            window.dispatchEvent(new CustomEvent('cirvio:messages-synced', { detail: { messages } }));
        }

        function renderMessages(thread) {
            const photo = profilePhoto();
            messagesEl.innerHTML = thread.messages.map((m) => {
                const mine = isOwnMessage(m);
                const label = mine ? 'You' : (m.from === 'cirvio' ? 'CIRVIO Admin' : (m.from === 'seller' ? 'Seller' : 'Buyer'));
                const avatar = mine && photo ? `<img src="${escChat(photo)}" alt="">` : `<span>${escChat(label.charAt(0))}</span>`;
                return `
                    <div class="chat-message ${mine ? 'mine' : ''}">
                        <div class="chat-avatar">${avatar}</div>
                        <div class="chat-bubble">
                            <strong>${escChat(label)}</strong>
                            <p>${escChat(m.text || '')}</p>
                            <small>${escChat(formatChatTime(m.createdAt) || m.time || 'Just now')}${mine ? '<span class="chat-seen">&#10003;&#10003;</span>' : ''}</small>
                        </div>
                    </div>
                `;
            }).join('');
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        listEl.addEventListener('click', (e) => {
            const btn = e.target.closest('.chat-thread');
            if (btn) selectThread(btn.dataset.thread);
        });

        document.getElementById('chatSearch').addEventListener('input', renderThreadList);
        document.getElementById('chatMobileBack').addEventListener('click', () => {
            document.body.classList.remove('chat-open');
        });
        deleteBtn.addEventListener('click', deleteActiveThread);

        function isDesktopChat() {
            return window.matchMedia('(min-width: 761px)').matches;
        }

        function openFirstThreadOnDesktop() {
            if (!activeThreadId && isDesktopChat()) {
                const first = groupThreads()[0];
                if (first) selectThread(first.id);
            }
        }

        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');

        function resizeComposer() {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 116) + 'px';
        }

        chatInput.addEventListener('input', resizeComposer);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('chatComposer').requestSubmit();
            }
        });

        document.getElementById('chatComposer').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = chatInput;
            const text = input.value.trim();
            if (!activeThreadId || !text) return;
            try {
                chatSendBtn.disabled = true;
                const thread = groupThreads().find((t) => t.id === activeThreadId);
                let saved = null;
                if (window.CirvioAPI && validBackendId(activeThreadId)) {
                    saved = await CirvioAPI.replyToMessage(activeThreadId, text);
                } else if (window.CirvioAPI && thread?.productId && validBackendId(thread.productId)) {
                    saved = await CirvioAPI.sendMessage(thread.productId, text);
                    activeThreadId = saved?.message?._id || activeThreadId;
                }
                if (saved?.message && window.CirvioMessages) {
                    await CirvioMessages.sync();
                } else if (thread) {
                    addLocalReply(thread, text);
                }
                input.value = '';
                resizeComposer();
                selectThread(activeThreadId);
                showToast('Message sent');
            } catch (err) {
                showToast(err.message || 'Could not send message');
            } finally {
                chatSendBtn.disabled = false;
            }
        });

        window.addEventListener('cirvio:messages-synced', () => {
            renderThreadList();
            if (activeThreadId) {
                selectThread(activeThreadId);
            } else {
                openFirstThreadOnDesktop();
            }
        });

        if (CirvioAuth.requireLogin()) {
            initCirvioChrome('messages');
            renderUserStrip();
            renderThreadList();
            openFirstThreadOnDesktop();
            if (window.CirvioMessages) CirvioMessages.sync();
        }
    </script>
</body>

</html>
