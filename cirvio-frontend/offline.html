<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Search and sharing metadata -->
    <meta name="description" content="CIRVIO is offline.">
    <meta name="robots" content="noindex,nofollow,noarchive">

    <link rel="canonical" href="https://cirvio.netlify.app/offline.html">
    <meta property="og:site_name" content="CIRVIO">
    <meta property="og:locale" content="en_IN">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Offline | CIRVIO">
    <meta property="og:description" content="CIRVIO is offline.">
    <meta property="og:url" content="https://cirvio.netlify.app/offline.html">
    <meta property="og:image" content="https://cirvio.netlify.app/cirvio-app-icon.png">
    <meta property="og:image:alt" content="CIRVIO student marketplace">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Offline | CIRVIO">
    <meta name="twitter:description" content="CIRVIO is offline.">
    <meta name="twitter:image" content="https://cirvio.netlify.app/cirvio-app-icon.png">

    <title>Offline | CIRVIO</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png" type="image/png">
    <meta name="theme-color" content="#2E3624">
    <style>
        :root {
            --olive-deep: #2E3624;
            --cream: #F6EAD8;
            --gold: #C8A45A;
            --ivory: #FFF9EF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--olive-deep);
            color: var(--ivory);
            font-family: 'Inter', system-ui, sans-serif;
            text-align: center;
            padding: 24px;
        }

        .wrap { max-width: 380px; }

        .mark {
            width: 64px; height: 64px; border-radius: 18px;
            border: 1.5px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 22px; font-family: Georgia, serif; font-style: italic;
            font-size: 30px; color: var(--gold);
        }

        h1 { font-size: 1.4rem; margin-bottom: 10px; }

        p { color: rgba(255, 249, 239, .78); font-size: .92rem; line-height: 1.6; margin-bottom: 26px; }

        button {
            background: var(--gold); color: var(--olive-deep); border: none;
            font-weight: 700; font-size: .88rem; padding: 12px 26px;
            border-radius: 999px; cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="mark">C</div>
        <h1>You're offline</h1>
        <p>CIRVIO couldn't reach the network. Check your connection — pages you've already visited may still be
            available.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>

</html>
