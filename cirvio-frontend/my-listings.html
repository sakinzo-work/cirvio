    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="common.js"></script>
    <script>
        const STATUS_LABEL = { draft: 'Draft', pending: 'Pending Review', approved: 'Live', rejected: 'Rejected' };

        function discountPct(p) {
            if (!p.orig || p.price === 0) return null;
            return Math.round(((p.orig - p.price) / p.orig) * 100);
        }

        function myListingCard(l) {
            const disc = l.orig && l.type === 'sell' ? discountPct(l) : null;
            let tag = '';
            if (l.status === 'draft') tag = '<div class="p-tag draft">Draft</div>';
            else if (l.status === 'pending') tag = '<div class="p-tag pending">Pending Review</div>';
            else if (l.status === 'rejected') tag = '<div class="p-tag rejected">Rejected</div>';
            else if (l.type === 'donate') tag = '<div class="p-tag donate">Donation</div>';
            else if (l.type === 'free') tag = '<div class="p-tag free">Free</div>';
            else if (disc) tag = `<div class="p-tag">${disc}% OFF</div>`;
            return `
                <div class="p-card">
                    <div class="p-thumb">${tag}<img src="${l.img}" alt="${l.title}" loading="lazy"></div>
                    <div class="p-body">
                        <div class="p-cat">${l.cat || 'Study Material'}</div>
                        <div class="p-title">${l.title || 'Untitled listing'}</div>
                        <div class="p-price-row">
                            <span class="p-price">${l.type === 'sell' ? 'Rs ' + (l.price || 0) : (l.type === 'donate' ? 'Donation' : 'Free')}</span>
                            ${l.orig && l.type === 'sell' ? `<span class="p-orig">Rs ${l.orig}</span>` : ''}
                        </div>
                        <div class="p-meta"><span class="cond">${l.cond || 'Good'}</span><span>${l.loc || 'Mumbai'}</span></div>
                        <div class="p-foot"><span>${l.time || 'Just now'}</span><span>${STATUS_LABEL[l.status] || 'Live'}</span></div>
                    </div>
                    <div class="p-card-actions">
                        ${l.status === 'draft' ? '<a href="sell.html" class="btn btn-ghost btn-sm">Edit</a>' : '<a href="status.html" class="btn btn-ghost btn-sm">Track Status</a>'}
                        <button type="button" class="btn btn-outline btn-sm rm-listing" data-id="${l.id}">Remove</button>
                    </div>
                </div>`;
        }

        function renderListings() {
            CirvioStore.processApprovals();
            const listings = CirvioStore.getListings();
            const grid = document.getElementById('listingsGrid');
            const empty = document.getElementById('listingsEmpty');
            if (!listings.length) {
                grid.innerHTML = '';
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';
                grid.innerHTML = listings.map(myListingCard).join('');
            }
        }

        document.getElementById('listingsGrid').addEventListener('click', (e) => {
            const rm = e.target.closest('.rm-listing');
            if (!rm) return;
            const id = rm.dataset.id;
            CirvioStore.setListings(CirvioStore.getListings().filter(l => String(l.id) !== String(id)));
            renderListings();
            showToast('Listing removed');
        });

        async function loadBackendListings() {
            renderListings();
            if (!window.CirvioAPI || !window.cirvioProductToListing) return;
            try {
                const { products } = await CirvioAPI.myListings();
                const backendListings = (products || []).map(cirvioProductToListing);
                if (window.CirvioListings) CirvioListings.syncLocalListingsWithBackend(backendListings, { silent: false });
                else {
                    const localDrafts = CirvioStore.getListings().filter(l => l.status === 'draft');
                    CirvioStore.setListings([...backendListings, ...localDrafts]);
                }
                renderListings();
            } catch (err) {
                console.warn('Could not load backend listings:', err.message);
            }
        }

        window.addEventListener('cirvio:listings-synced', renderListings);
        if (CirvioAuth.requireLogin()) loadBackendListings();
        initCirvioChrome('profile');
    </script>
</body>
